<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAT Ontological Archive</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/forum.css">
  <link rel="stylesheet" href="css/docs.css">
  <link rel="stylesheet" href="css/contextMenu.css">
</head>
<body class="appearance-og theme-gold" data-appearance="og" data-theme="gold" data-background="spaceAnimated">
  <div class="star-layer" aria-hidden="true"></div>
  <section id="loginRoot" class="login-root hidden"></section>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" aria-label="Proyectos">
      <button class="sidebar-toggle" data-action="toggle-sidebar" type="button" title="Minimizar barra">☰</button>
      <button class="brand-plate" data-action="open-forum" type="button" title="Menu principal">
        <span>RAT</span>
        <span>Ontological</span>
        <span>Archive</span>
      </button>
      <div class="side-scroll">
        <div id="projectList" class="project-list"></div>
      </div>
      <button id="quickCreateProject" class="side-add" type="button" data-action="create-project">+</button>
    </aside>

    <header class="topbar">
      <div class="topbar-title">
        <span class="overline">R.O.A. ACTIVE REGISTRY</span>
        <strong id="activeProjectTitle">Sin proyecto activo</strong>
      </div>
      <div class="topbar-actions">
        <button id="topbarUsername" class="username-button" data-action="open-profile" type="button">Usuario</button>
        <button class="icon-button gear-button" data-action="open-settings" type="button" title="Configuracion">
          <span class="gear-shape" aria-hidden="true"></span>
          <span class="sr-only">Configuracion</span>
        </button>
        <button id="profileButton" class="profile-button" data-action="open-profile" type="button" title="Perfil">
          <span id="profileInitials">ROA</span>
        </button>
        <nav id="userMenu" class="user-menu hidden" aria-label="Menu de usuario">
          <button data-action="create-project" type="button">Crear proyecto</button>
          <button data-action="delete-project" type="button">Eliminar proyecto seleccionado</button>
          <button data-action="export-project" type="button">Exportar proyecto</button>
          <label class="menu-file">
            Importar proyecto
            <input id="projectImportInput" type="file" accept="application/json">
          </label>
          <button data-action="app-info" type="button">Informacion de la app</button>
        </nav>
      </div>
    </header>

    <main id="mainView" class="main-view" tabindex="-1"></main>
  </div>

  <div id="modalRoot" class="modal-root hidden" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input id="backupImportInput" class="hidden-file" type="file" accept="application/json">
  <input id="galleryInput" class="hidden-file" type="file" accept="image/*,video/mp4,video/webm,video/ogg" multiple>
  <input id="avatarInput" class="hidden-file" type="file" accept="image/*">
  <input id="profileBannerInput" class="hidden-file" type="file" accept="image/*">
  <input id="backgroundInput" class="hidden-file" type="file" accept="image/*">

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mediaStorage.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/users.js"></script>
  <script src="js/forum.js"></script>
  <script src="js/contextMenuRight.js?v=1"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/dynamicFields.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/files.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
